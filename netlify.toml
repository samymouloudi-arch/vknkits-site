# Réglages Netlify — site statique, aucune compilation
[build]
  publish = "."
  command = ""

# Cache long pour les polices et les images
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
